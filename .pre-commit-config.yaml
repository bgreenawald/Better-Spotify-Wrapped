ci:
  # Configuration for the pre-commit.ci service
  autofix_prs: true
  autoupdate_schedule: weekly
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      - id: ruff
        name: ruff-lint
        args: [--fix]
      - id: ruff-format
        name: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run python -m pytest tests/ -k "not test_app_starts"
        language: system
        pass_filenames: false
        always_run: false
        files: \.py$
        stages: [pre-commit]
        ci:
          skip: true
